  <title>Reading list</title>

<body>

       load, so a failing getByRole('listitem') must get the NORMAL
       below-threshold near-miss refusal, not the widget-state one. -->

  <ul>
    <li>Quarterly revenue report</li>
    <li>Deployment checklist</li>
  </ul>
</body>
