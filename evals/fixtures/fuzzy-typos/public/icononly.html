<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Icon only</title>
</head>
<body>
  <!-- The /shadowdom-transcript shape: the button renders only an icon —
       no text, no aria-label, no title. A role-and-name locator can never
       target it; the near-miss refusal must teach that, not just score. -->
  <h1>Gear console</h1>
  <button id="buttonGenerate" type="button"><i class="fa fa-cog"></i></button>
</body>
</html>
