<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mouse over</title>
</head>
<body>
  <!-- The /mouseover shape: an anchor WITHOUT href is not exposed as a
       link; a link-role locator cannot find it, and the refusal must say
       why instead of a bare "cannot be verified". -->
  <h1>Mouse over</h1>
  <a title="Click me">Click me</a>
</body>
</html>
