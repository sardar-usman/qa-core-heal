<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mixed frames</title>
</head>
<body>
  <!-- Same-origin playground frame beside a cross-origin widget (the
       GitHub-Star shape): the iframe note must name only the same-origin
       frame — the widget can never hold the app's element. -->
  <h2>File Upload</h2>
  <iframe src="upload-frame.html" title="playground"></iframe>
  <iframe src="http://127.0.0.1:59999/star.html" title="star widget"></iframe>
</body>
</html>
