<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Visibility</title>
</head>
<body>
  <!-- The 0.3.4 emit-identity field shape (/visibility): the button has a
       stable id AND the accessible name "Removed". The broken token
       ("#removed" / name "Removd") must never be echoed into the emit:
       a css original prefers the id heal; a role original gets the full
       computed name with exact: true. -->
  <h1>Visibility</h1>
  <button id="removedButton" type="button"
    onclick="document.getElementById('note').textContent = 'gone'">Removed</button>
  <p id="note"></p>
</body>
</html>
