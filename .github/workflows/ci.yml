name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The package needs Node 22.6 or later (see "engines" in package.json).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  cypress:
    name: Cypress Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-16.2.1-${{ runner.os }}

      - name: Install Cypress
        run: npm install --no-save --no-audit --no-fund cypress@16.2.1 && npx cypress install && npx cypress verify

      - name: Typecheck
        run: npm run typecheck

      - name: Cypress tests
        run: npm run build && QA_CORE_HEAL_CYPRESS=1 node --import ./tests/helpers/temps.mjs --test tests/cypress-heal.test.mjs

  selenium:
    name: Selenium Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Install Selenium and Mocha
        run: npm install --no-save --no-audit --no-fund selenium-webdriver@4.51.0 mocha@12.0.3

      - name: Typecheck
        run: npm run typecheck

      - name: Probe Chrome before the sandbox change
        run: node scripts/probe-chrome-session.mjs

      - name: Allow Chrome sandbox user namespaces
        run: |
          # Ubuntu 24.04 can block unprivileged user namespaces. Chrome for Testing
          # then exits, and ChromeDriver reports SessionNotCreatedError. Chromium's
          # documented workaround:
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi

      - name: Selenium tests
        run: npm run build && QA_CORE_HEAL_SELENIUM=1 node --import ./tests/helpers/temps.mjs --test tests/selenium-heal.test.mjs
